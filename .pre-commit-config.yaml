repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  # black deliberately absent: ruff format (below) is the project formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in .venv (`ruff --version`).
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The manual verification gate: full test suite and the spec integrity
  # checker, pinned to the project venv. Bypass one-off with --no-verify.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        # Leading ./ is required on Windows (CreateProcess rejects relative
        # exe paths without a separator). POSIX venvs use .venv/bin/python.
        entry: ./.venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
      - id: spec-references
        name: spec reference checker
        entry: ./.venv/Scripts/python.exe spec/tools/check_references.py
        language: system
        pass_filenames: false
        files: ^spec/
