# FTMO Challenge: 2-Step — $100,000 — verified 2026-09-21 from FTMO's official
# Trading Objectives page (https://ftmo.com/en/trading-objectives/). Note: FTMO
# no longer offers a separate Swing product; the 2-Step is the standard
# programme. All resets and day boundaries are 00:00 CE(S)T (Europe/Prague).
# Every rule below was on the page's applicable-objectives list at retrieval;
# rules absent from that list are marked not_applicable with the same evidence.
