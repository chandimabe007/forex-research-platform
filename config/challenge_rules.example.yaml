# The CHAL-010 rule model — firm-agnostic: replace with the verified rules for
# your chosen firm + programme + account type triple (PROD-023, MILE-020).
# Every field is unknown | not_applicable | verified (CHAL-011). The research
# entry points refuse to run while any rule is unknown.
# This template carries placeholder provenance and is NOT verified data.
