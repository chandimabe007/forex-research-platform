[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-research"
version = "0.1.0"
description = "A measuring instrument for systematic forex ideas (spec-driven clean-room rebuild)."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "numpy>=1.26",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
